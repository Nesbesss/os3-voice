name: OS3Voice
options:
  bundleIdPrefix: com.nesbes
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  OS3Voice:
    type: application
    platform: iOS
    sources: [App, Shared]
    configFiles: {Debug: local.xcconfig, Release: local.xcconfig}
    dependencies:
      - target: OS3VoiceLive
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OS3 Voice
        UILaunchScreen: {}
        UIBackgroundModes: [audio]          # keeps the mic + speech going with the screen locked / app in the background
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Talk to OS3 hands-free."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nesbes.os3voice
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  OS3VoiceLive:
    type: app-extension
    platform: iOS
    sources: [Live, Shared]
    configFiles: {Debug: local.xcconfig, Release: local.xcconfig}
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: OS3 Voice
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nesbes.os3voice.live
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
